name: tf-triage

# Hourly pull of new TestFlight feedback from App Store Connect, files each
# new item as a GitHub issue with classification + investigation. Replaces
# the Anthropic Routines schedule of the same name; lives here so:
#
#   - apple.com is directly reachable from GitHub-hosted runners (no relay
#     proxy needed)
#   - ASC secrets and the autofix loop live in one place
#   - manual replay (workflow_dispatch) is one click

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Hourly cron and a manual replay must not stomp on each other's
# meta-state cursor write.
concurrency:
  group: tf-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble prompt (_shared.md + tf-triage.md)
        id: prompt
        run: |
          set -euo pipefail
          # The action sends the prompt input to Claude Code under the
          # default `claude_code` system-prompt preset, which treats long
          # markdown as docs/role-assignment rather than a command. Without
          # an explicit imperative leader, Claude responds "Ready. What
          # would you like me to do?" and exits. Prepend a one-line directive.
          {
            echo 'content<<PROMPT_EOF'
            echo 'Execute the TRIAGE routine described below right now. Use the available tools (Bash, Read, Grep, Glob, Task) as needed. Do not ask for confirmation. End with the summary line specified in the "Summary line" section.'
            echo
            echo '---'
            echo
            cat .claude/routines/_shared.md
            printf '\n\n---\n\n'
            cat .claude/routines/tf-triage.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: "true"
          prompt: ${{ steps.prompt.outputs.content }}
          claude_args: |
            --model claude-opus-4-7[1m]
            --max-turns 80
            --allowedTools Bash,Read,Grep,Glob,Task

      - name: Upload Claude session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: warn
